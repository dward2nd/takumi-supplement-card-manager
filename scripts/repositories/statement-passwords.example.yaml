# Statement-PDF decryption passwords — COMMITTED TEMPLATE (no real secrets).
#
# Copy to statement-passwords.yaml (gitignored) and fill in real passwords.
# Mirrors the .env / .env.example convention used for the Notion token.
#
# Keyed by the `issuer` field of cards/*.yaml. Resolution is:
#   card name -> card_repo issuer -> this map.
# Read by lib/statement_secrets.py; consumed by audit-bill/extract.py
# (pass --card "<title>" and the password is auto-resolved when --password is omitted).
issuers:
  # Scalar value = one password for every card from this issuer. Krungsri-family
  # statements bundle the primary + all supplements in one PDF locked with the
  # PRIMARY holder's date of birth, so a single value covers all four cards.
  Krungsri: "DDMonYYYY"        # e.g. primary holder's DOB, formatted as the bank expects

  # Mapping form — use when an issuer locks each supplement's PDF with that
  # holder's own DOB instead of the primary's (holders keyed by lowercase slug):
  # CardX:
  #   default: "DDMonYYYY"     # primary
  #   holders:
  #     nuta: "DDMonYYYY"
