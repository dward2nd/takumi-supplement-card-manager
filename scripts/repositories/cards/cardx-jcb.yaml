name: CardX JCB
issuer: CardX
bill_cycle_pattern: krungsri      # same BC/DD shape as the krungsri pattern (day 5, +20d) — a coincidence of shape only
statement_numbers:            # last 4 digits on the statement → holder (CardX prints one PDF per card number)
  "1265": nuta                # her own card's PDF, locked with her DOB, with its own points (seen 2026-09-29)
# CardX is part of the SCB X group — a completely different financial group from
# Krungsri (user, 2026-08-08). It shares only the bill-cycle pattern key above.
# So Krungsri-family rules do NOT reach this card: lib.earning gives it the plain
# `Card` class (no 7-11/TrueMoney points rule, no rewards-paid-upfront) — see below.
notes: |
  Installments: deliberately NOT the rewards-paid-upfront rule. Only plans
  converted under the ดีจังผ่อน 0% campaign lose points on this card (user,
  2026-08-10); merchant-offered installments earn normally. A card-level rule
  would wrongly zero both. The campaign is plan-level and detected from the
  `Note` on earlier terms — see
  scripts/repositories/installment-campaigns/dee-jang.yaml and
  docs/concepts/installment-reward-campaigns.md.

  Tell for a ดีจังผ่อน plan: 4 terms, where Thai plans conventionally run 3, 6
  or 10. Advisory only — never auto-applied.

  Bank notices printed on the 5 Oct 2026 statement (…1265). Not yet encoded in
  lib.earning, so set them by hand on /add-transaction:
  - From 1 Aug 2026: no POINTX and no cashback on MCC 6540, e-wallet top-ups and
    account funding of every kind (CardX-wide notice).
  - From 1 Sep 2026: the 3% cashback on JPY/KRW/HKD/SGD/TWD spend in Japan,
    South Korea, Hong Kong, Singapore and Taiwan is counted per whole ฿1,000 of
    each sales slip, capped at ฿1,800 per card per cycle; spend in those five
    countries earns no POINTX (tick ×0).
