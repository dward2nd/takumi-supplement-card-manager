statement_numbers:            # last 4 digits on the statement → holder (seen 2026-09-27)
  "7805": takumi
notes: |
  Registered 2026-09-27. Takumi's own card — the statement prints it as
  `KBANK-LINE POINTS` (4417 70XX XXXX 7805); `name` is the Cards DS title in
  Takumi's Cards DB. Shares the KBank statement (and its day-25 / day-10
  cycle) with KBank PLUSTINUM and KBank Shopee.

  No reward fields are set, so `classify` returns the default `×1` and no
  cashback. That is a placeholder, not a confirmed policy.

  Earns LINE POINTS (1 point = ฿1), not K Point: 1% at other shops (MCC 4814 and 7399
  excluded), and through LINE Pay, per calendar month, 3% per whole ฿1,000 up to ฿10,000
  and 5% above, ≤ 400 LINE POINTS a month (card page, read 2026-10-02). AIS bills paid
  through LINE Pay (`LP_AIS SERVICE BANGKOK`) do earn the LINE Pay rate (user, 2026-11-01),
  at 3% while the card's LINE Pay spend stays under ฿10,000 a month.
