name: AEON World Mastercard
issuer: AEON
bill_cycle_pattern: aeon
statement_numbers:            # last 4 digits on the statement → holder (seen 2026-09-27)
  "5201": takumi
points_excluded_merchants:
  # AEON withholds reward points on a list of MCCs from 2025-11-11, on every AEON
  # credit card except Big C (https://www.aeon.co.th/aeon/news-events/notification-aeon-credit-cards-2025).
  # 5199 is on the list and 5411 (supermarkets) isn't. The household treats
  # `WWW.MAKRO.PRO` as 5199 for points; which MCC each Makro PRO string posts under
  # isn't known (a 5411/5199 split once written here was a misreading, corrected
  # 2026-11-01). Points only (user, 2026-11-01: "MCC 5199 gains no points but is still
  # eligible for cashback promotions"): AEON World 5% and NTW1 paid ฿500 + ฿120 on
  # 11 Jul – 10 Aug 2026, whose spend was all `WWW.MAKRO.PRO`.
  - prefix: "WWW.MAKRO.PRO "
    mcc: "5199"
    effective_from: 2025-11-11
    note: "MCC 5199 — AEON gives no reward points on this MCC since 11 Nov 2025. Points only: AEON World 5% and NTW1 still count this row."
notes: |
  The same notification also withholds points on some foreign-registered
  merchants (EU/EEA, China, UK) from 2025-12-11 and on 0% installments from
  2026-01-11. Neither is encoded here yet.

  Cashback (read 2026-09-29, https://www.aeon.co.th/aeon/cards/aeon-world-mastercard):
  5% at partner supermarkets (Big C, Lotus's, Foodland, Villa Market, Tops, Gourmet
  Market & Home Fresh Mart, Central Food Hall, Makro Pro), ฿500 a statement cycle
  per primary card, spend 2026-04-01 → 2027-01-31. And Takumi's Everyday with AEON
  (NTW1) registration sits on this card. Both are Promotion Bureau classes
  (lib/bureau/aeon_world.py, ntw1.py), not promotion YAML: the household keeps
  `% cb` unset on these rows (docs/promotions/aeon-2026.md). Both count by transaction
  date, 11th–10th, whatever statement a row bills on (2026-10-29).
