name: UOB World
issuer: UOB
bill_cycle_pattern: uob
statement_numbers:            # last 4 digits on the statement → holder (seen 2026-09-27)
  "9310": takumi
  "1009": baiboon
  "4488": takumi              # the primary's number until the Apr 2026 statement; 9310 from May 2026
points_default: "×2"
notes: |
  Points card — earns NO cashback on any row; `% cb` stays unset always.

  Two earning tiers, both predating the promotions system (user, 2026-08-20):

    - `×5` — the standing bonus, active in the data since 2025-01-28. Encoded
      as promotions/uob-world-points.yaml so it carries effective dates.
    - `×2` — this card's BASE rate for Thailand merchants, and what rows fall
      back to once the bonus quota is used up. That is why `points_default`
      here is `×2` and not `×1`: an unboosted UOB World row still earns
      double, so `×1` would under-report.

  **Per-cycle bonus quota ฿20,000** — per account (Takumi + Baiboon), counting
  every transaction, first come, first served; ×5 only on the bank's bonus
  categories (online, e-wallet, dining, travel, FX). Enforced by the Promotion
  Bureau since 2026-09-28 (lib/bureau/uob_world.py, /sync-promotion), which
  also checks each row's multiplier. `lib.promotions.classify` still returns
  `×5` for every row; the Bureau sync is what corrects it.
