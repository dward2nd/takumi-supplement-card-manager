name: Krungsri Lady
issuer: Krungsri
brand: Krungsri Card
bill_cycle_pattern: krungsri
statement_numbers:            # last 4 digits on the statement → holder (seen 2026-09-27; supplements named on the statement)
  "9745": takumi
points_excluded_merchants:
  # Krungsri Point terms item 2.3 (7), https://www.krungsricard.com/th/krungsri-point (read 2026-11-01):
  # "ทุกการใช้จ่ายที่แม็คโคร ทุกช่องทางการจำหน่ายและการใช้จ่ายภายใต้ MCC 5199 … โดยมีผลตั้งแต่วันที่ 1 พฤศจิกายน 2569".
  # Every Makro channel the ledger has seen: both Makro PRO strings, a card at a store
  # (`MAKRO_…`), Makro's in-store QR (`CP AXTRA …`) and TrueMoney at Makro (already ×0
  # under the 7-Eleven/TrueMoney rule). Other MCC 5199 merchants aren't known by name.
  # Encoded 2026-11-08 (user: "Krungsri Card (and First Choice …) has stopped giving reward
  # points to Makro").
  - prefix: "WWW.MAKRO.PRO"
    mcc: "5199"
    effective_from: 2026-11-01
    note: "Makro — no Krungsri Point at Makro, every channel, nor on MCC 5199, from 1 Nov 2026 (Krungsri Card). Points only: cashback campaigns are separate."
  - prefix: "HTTPS://WWW.MAKRO.PRO/"
    mcc: "5199"
    effective_from: 2026-11-01
    note: "Makro — no Krungsri Point at Makro, every channel, nor on MCC 5199, from 1 Nov 2026 (Krungsri Card). Points only: cashback campaigns are separate."
  - prefix: "MAKRO_"
    mcc: "5199"
    effective_from: 2026-11-01
    note: "Makro — no Krungsri Point at Makro, every channel, nor on MCC 5199, from 1 Nov 2026 (Krungsri Card). Points only: cashback campaigns are separate."
  - prefix: "CP AXTRA"
    mcc: "5199"
    effective_from: 2026-11-01
    note: "Makro — no Krungsri Point at Makro, every channel, nor on MCC 5199, from 1 Nov 2026 (Krungsri Card). Points only: cashback campaigns are separate."
  - prefix: "TMN MAKRO"
    mcc: "5199"
    effective_from: 2026-11-01
    note: "Makro — no Krungsri Point at Makro, every channel, nor on MCC 5199, from 1 Nov 2026 (Krungsri Card). Points only: cashback campaigns are separate."
  - prefix: "TMN*MAKRO"
    mcc: "5199"
    effective_from: 2026-11-01
    note: "Makro — no Krungsri Point at Makro, every channel, nor on MCC 5199, from 1 Nov 2026 (Krungsri Card). Points only: cashback campaigns are separate."
notes: |
  Registered 2026-09-14 at the user's instruction, alongside the first
  transaction ever recorded against this card. The Notion Cards row already
  existed but was empty — no ธนาคาร/บริษัท (bank/company) set, zero balance,
  zero transactions — so nothing in the repo referenced it.

  UNVERIFIED — `bill_cycle_pattern: krungsri` (cut-off day 5, due +20 days) is
  inherited from the three sibling Krungsri cards, NOT confirmed against a
  statement. No Krungsri Lady statement has been seen. Re-check against the
  first statement and correct this key if the real cut-off differs; the
  2026-09-14 `HTTPS://WWW.MAKRO.PRO/` row was filed under BC 2026-10-05 /
  DD 2026-10-25 on this assumption and would need repointing too.

  The two Krungsri-family reward flags above are inherited on the same basis
  (issuer-level rules, so they should hold), but neither has been observed on
  this card's own data yet.

  Cashback is paid as Krungsri credit lines and tracked in the Promotion
  Bureau, never as `% cb` (no `promotions/*.yaml` targets this card): the
  Krungsri Card campaigns (SUP1, BXP, Bangchak700, ...) and the card's own
  LADY'S FASHIONISTA, ฿140 per whole ฿2,000 slip at ZARA, H&M, JASPAL, Pomelo,
  SEPHORA, EVEANDBOY and Adidas, 1 Jan 2025 – 31 Dec 2026 (read 2026-10-28,
  `lib/bureau/lady_fashionista.py`). Krungsri withholds points only on the
  slips that earn it, so the Bureau ticks `×0` on those and the card has no
  `points_excluded_merchants` entry: a ฿1,500 slip there still earns points.
