name: UOB Cash Plus
issuer: UOB
bill_cycle_pattern: uob       # confirmed by the first statement: dated 25 Nov 2026, due 18 Dec, like the credit cards
statement_numbers:            # last 4 digits on the statement → holder (first statement, 25 Nov 2026)
  "5024": takumi              # a cash card has no supplements: friends' lines are their [บัตรหลัก] rows
points_default: "×0"
notes: |
  A cash card (บัตรกดเงินสด), not a credit card: a personal-loan line in
  Takumi's name. Thai cash cards earn no points or cashback on anything
  (user, 2026-10-27), so `lib.earning.CashCard` forces ×0 and no `% cb` on
  every row, promotions included.

  A cash card can't have a supplement, so every row a friend owes on it goes
  in that friend's ledger as `[บัตรหลัก] …` and in Takumi's statement total.

  First use (2026-10-27): Nuta's `UNITHAI TRIP CO.,LTD. BANGKOK TH` ฿20,000
  (5 Oct, her UOB One, cycle 2026-10-22) became a 12-month cash loan at 8.99%
  a year. Takumi drew ฿20,000 on this card and paid it into UOB One (slip
  27 Oct, memo `นุตาผ่อนจ่าย UNITRIP`), so Nuta's UOB One books a ฿20,000
  payment. Second loan 16 Nov: ฿16,000 for UNITHAI TRIP ฿15,976 (slip
  26 Nov, memo `ทัวร์จีนนุตา`).

  The UOB app (2026-11-26) shows each term as two lines, named per loan
  (`MPFCDM00001` = ฿20,000, `MPFCDM00002` = ฿16,000): `MONTHLY PRIN NN/12` (fixed instalment − balance × 8.99%/12,
  rising monthly) and `MONTHLY INT NN/12` (balance × 8.99% × actual days/365).
  Term 01/12 sat in the 2026-11-25 cycle, so the `uob` pattern holds. Terms
  vary every month, so /populate-installment can't copy them: enter each from
  the app or statement. See docs/cards/uob-cash-plus.md.

  First statement (25 Nov 2026): a PDF of its own (account 816-…, the credit
  cards' bundle is 810-…), card 4043 65XX XXXX 5024, the four MPFCDM lines
  exactly as the app showed them (฿3,065.58). lib/statements/uob.py can't
  read it yet: the heading shares a line with the card number and the total
  is a bare `TOTAL BALANCE`, so its bill is filed by hand with /update-bill.
