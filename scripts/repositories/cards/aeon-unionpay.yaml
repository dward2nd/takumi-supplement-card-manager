name: AEON UnionPay
issuer: AEON
bill_cycle_pattern: aeon
statement_numbers:            # last 4 digits on the statement → holder (seen 2026-09-27)
  "2918": takumi
notes: |
  Cashback (read 2026-09-29, https://www.aeon.co.th/aeon/cards/aeon-unionpay-platinum-card):
  3% on spend in CNY, HKD, MOP or TWD, on the baht amount after conversion; at most ฿2,500
  per primary card per statement cycle (฿30,000 a year), supplements included. The household
  marks `% cb` 3% by hand (Nuta's Alipay rows, currency in the Note); the cap is the Promotion
  Bureau's (lib/bureau/aeon_unionpay.py). No points.
