  Held by BOTH Takumi and Baiboon — the only card outside the UOB/AEON sets
  with that shape. Missing from `docs/cards/_stubs.md` until 2026-09-23.

  `issuer: Krungsri` is inferred, not read from Notion: Baiboon's Cards row
  leaves `ธนาคาร/บริษัท` unset, and Takumi's Cards DS has no issuer column at
  all. The BC day 5 / due +20 cycle matches the Krungsri family exactly
  (6 dated rows, no exceptions), and Central The 1 is a Central Cards /
  Krungsri Consumer product.

  Family membership on both reward flags confirmed by the user 2026-09-23:
  The 1 cards follow the Krungsri family on the 7-11 / TrueMoney points
  exclusion and on upfront installment rewards.
